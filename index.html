<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC Hdance - 10 Tests de Déformation 3D</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #111; color: #fff; font-family: sans-serif; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; font-size: 1.2rem; pointer-events: none; text-align: center; }

        #bottom-half { height: 320px; display: flex; background: #0a0a0a; }
        #controls-panel { width: 320px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .slider-group { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #00ffcc; }
        input[type=range] { cursor: pointer; width: 100%; }
        
        .btn-action { background: #00ffcc; color: #000; padding: 8px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 12px; }
        .btn-action:hover { background: #00cca3; }
        
        select { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px; font-weight: bold; border-radius: 4px; outline: none; cursor: pointer; }

        #log-panel { flex: 1; padding: 12px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; color: #00ff66; white-space: pre-wrap; line-height: 1.3; background: #050505; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Chargement POC...<br><span id="loading-details" style="font-size: 0.8rem; color: #aaa;"></span></div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff; border-bottom:1px solid #333; padding-bottom:5px; font-size:14px;">🛠 Banc d'Essai (POC)</h3>
        
        <label style="font-size: 12px; color: #aaa;">Sélectionnez une méthode de test :</label>
        <select id="test-selector">
            <option value="1">Test 1: Classic LookAt (Base)</option>
            <option value="2" selected>Test 2: Local Quat Inverse</option>
            <option value="3">Test 3: Global Quat Brut</option>
            <option value="4">Test 4: BindMode Attached + Skin Update</option>
            <option value="5">Test 5: MatrixAutoUpdate False</option>
            <option value="6">Test 6: Skeleton Pose Reset Loop</option>
            <option value="7">Test 7: Euler Rotation Directe</option>
            <option value="8">Test 8: Full Scene Traverse Update</option>
            <option value="9">Test 9: Override Local Matrix</option>
            <option value="10">Test 10: Dynamic Re-bind Skeleton</option>
        </select>

        <button id="btn-force-play" class="btn-action">▶ Forcer la lecture 3D</button>
        <button id="toggle-debug" class="btn-action" style="background:#444; color:#fff;">Masquer Sphères IA</button>
        
        <div class="slider-group">
            <label for="camZ">Zoom : <span id="valZ">3.0</span>m</label>
            <input type="range" id="camZ" min="0.5" max="10" step="0.1" value="3.0">
        </div>
    </div>
    <div id="log-panel">Initialisation du diagnostic système...</div>
</div>

<script>
// ==========================================
// 1. MAPPING FLEXIBLE
// ==========================================
const BONE_KEYWORDS = {
    hips: "Hips", spine: "Spine", neck: "Neck", head: "Head",
    leftShoulder: "LeftArm", rightShoulder: "RightArm",
    leftElbow: "LeftForeArm", rightElbow: "RightForeArm",
    leftHip: "LeftUpLeg", rightHip: "RightUpLeg",
    leftKnee: "LeftLeg", rightKnee: "RightLeg"
};

// ==========================================
// 2. SCÈNE 3D
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0.5, 3.0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.update();

scene.add(new THREE.AmbientLight(0x404050, 1.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);
scene.add(new THREE.GridHelper(10, 10, 0x00ffcc, 0x333333));

const debugSpheres = [];
const sphereGeo = new THREE.SphereGeometry(0.025, 16, 16);
const matRed = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const matGreen = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

for(let i=0; i<21; i++) {
    const mesh = new THREE.Mesh(sphereGeo, i%2 !== 0 ? matRed : matGreen);
    scene.add(mesh);
    debugSpheres.push(mesh);
}

// ==========================================
// 3. CHARGEMENT
// ==========================================
let avatarModel = null, avatarBones = {}, skinnedMeshes = [], skeletonRef = null;
let isModelLoaded = false, isJsonLoaded = false;
let currentMethod = 2; // Test par défaut

const logPanel = document.getElementById('log-panel');
let sysLogs = "=== CHARGEMENT ===\n";

new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    gltf.animations = [];
    
    avatarModel.traverse((child) => {
        if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({ color: 0x0088cc, roughness: 0.3 });
            if (child.isSkinnedMesh) {
                skinnedMeshes.push(child);
                skeletonRef = child.skeleton;
            }
        }
    });

    const allNodes = [];
    avatarModel.traverse(c => allNodes.push(c));
    for (const [logic, key] of Object.entries(BONE_KEYWORDS)) {
        const match = allNodes.find(n => n.name.toLowerCase().includes(key.toLowerCase()));
        if(match) avatarBones[logic] = match;
    }

    avatarModel.scale.set(0.01, 0.01, 0.01);
    scene.add(avatarModel);
    isModelLoaded = true;
    checkReady();
});

let posesData = [];
let currentVideoTime = 0, isManualPlaying = false, manualStartTime = 0;
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('play', () => { isManualPlaying = true; manualStartTime = Date.now() - (currentVideoTime * 1000); });
player.addEventListener('timeupdate', (e) => { if(e.currentTime > 0) currentVideoTime = e.currentTime; });

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(r => r.text()).then(text => {
        text.trim().split('\n').slice(1).forEach(l => posesData.push(JSON.parse(l)));
        isJsonLoaded = true; checkReady();
    });

function checkReady() {
    if (isModelLoaded && isJsonLoaded) {
        document.getElementById('loading').style.display = 'none';
    }
}

// ==========================================
// 4. MOTEUR DES 10 TESTS
// ==========================================
function getMetricPoint(frame, k) {
    const idx = 133 + (k * 3);
    return new THREE.Vector3(frame[idx], -frame[idx+1], -frame[idx+2]);
}

document.getElementById('test-selector').addEventListener('change', (e) => {
    currentMethod = parseInt(e.target.value);
    sysLogs = `⚠️ Méthode changée : Test ${currentMethod}\n`;
});

function applyTestLogic(bone, startPos, endPos, axis, method) {
    if(!bone || !startPos || !endPos) return;
    
    const dir = new THREE.Vector3().subVectors(endPos, startPos).normalize();
    const targetQuat = new THREE.Quaternion().setFromUnitVectors(axis, dir);

    switch(method) {
        case 1: // Classic LookAt
            const targetPos = new THREE.Vector3().addVectors(bone.getWorldPosition(new THREE.Vector3()), dir);
            bone.lookAt(targetPos);
            bone.updateMatrixWorld(true);
            break;

        case 2: // Local Quat Inverse
        case 4: // Sera complété dans applyPose
            if (bone.parent) {
                bone.parent.updateMatrixWorld(true);
                const pQuat = new THREE.Quaternion();
                bone.parent.getWorldQuaternion(pQuat);
                targetQuat.premultiply(pQuat.invert());
            }
            bone.quaternion.copy(targetQuat);
            bone.updateMatrixWorld(true);
            break;

        case 3: // Global Quat Brut
            bone.quaternion.copy(targetQuat);
            bone.updateMatrixWorld(true);
            break;

        case 5: // MatrixAutoUpdate False
            bone.matrixAutoUpdate = false;
            if (bone.parent) {
                bone.parent.updateMatrixWorld(true);
                const pQuat = new THREE.Quaternion();
                bone.parent.getWorldQuaternion(pQuat);
                targetQuat.premultiply(pQuat.invert());
            }
            bone.quaternion.copy(targetQuat);
            bone.updateMatrix();
            bone.matrixWorldNeedsUpdate = true;
            break;

        case 6: // Pose Reset
            if (skeletonRef) skeletonRef.pose();
            bone.quaternion.copy(targetQuat);
            bone.updateMatrixWorld(true);
            break;

        case 7: // Euler Direct
            const euler = new THREE.Euler().setFromQuaternion(targetQuat, 'XYZ');
            bone.rotation.set(euler.x, euler.y, euler.z);
            bone.updateMatrixWorld(true);
            break;

        case 8: // Traverse update sera géré dans applyPose
            bone.quaternion.copy(targetQuat);
            break;
            
        case 9: // Override Matrix
            bone.matrixAutoUpdate = false;
            bone.matrix.makeRotationFromQuaternion(targetQuat);
            bone.matrixWorldNeedsUpdate = true;
            break;

        case 10: // Dynamic Rebind géré dans applyPose
            bone.quaternion.copy(targetQuat);
            bone.updateMatrixWorld(true);
            break;
    }
}

function applyPose(frame) {
    if (!frame) return;

    for(let i=0; i<21; i++) {
        const pt = getMetricPoint(frame, i);
        if(debugSpheres[i]) debugSpheres[i].position.copy(pt);
    }

    const midHip = new THREE.Vector3().addVectors(getMetricPoint(frame, 11), getMetricPoint(frame, 12)).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(getMetricPoint(frame, 3), getMetricPoint(frame, 4)).multiplyScalar(0.5);

    if(avatarModel) avatarModel.position.copy(midHip);

    const axisY = new THREE.Vector3(0, 1, 0);
    const axisX = new THREE.Vector3(1, 0, 0);
    const axisNX = new THREE.Vector3(-1, 0, 0);

    applyTestLogic(avatarBones.spine, midHip, midShoulder, axisY, currentMethod);
    applyTestLogic(avatarBones.neck, midShoulder, getMetricPoint(frame, 0), axisY, currentMethod);
    applyTestLogic(avatarBones.leftShoulder, getMetricPoint(frame, 3), getMetricPoint(frame, 5), axisX, currentMethod);
    applyTestLogic(avatarBones.rightShoulder, getMetricPoint(frame, 4), getMetricPoint(frame, 6), axisNX, currentMethod);
    applyTestLogic(avatarBones.leftElbow, getMetricPoint(frame, 5), getMetricPoint(frame, 7), axisX, currentMethod);
    applyTestLogic(avatarBones.rightElbow, getMetricPoint(frame, 6), getMetricPoint(frame, 8), axisNX, currentMethod);

    // Finalisations spécifiques par méthode
    if (currentMethod === 4) {
        skinnedMeshes.forEach(m => { m.bindMode = 'attached'; if(m.skeleton) m.skeleton.update(); });
    }
    if (currentMethod === 8) {
        scene.traverse(c => { if(c.updateMatrixWorld) c.updateMatrixWorld(true); });
    }
    if (currentMethod === 10 && skeletonRef && skinnedMeshes[0]) {
        skinnedMeshes.forEach(m => m.bind(new THREE.Skeleton(skeletonRef.bones)));
    }
}

// ==========================================
// 5. ANIMATION LOOP
// ==========================================
function animate() {
    requestAnimationFrame(animate);

    if (posesData.length > 0) {
        if(isManualPlaying) currentVideoTime = (Date.now() - manualStartTime) / 1000;
        const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25) % posesData.length];
        
        if (frame) {
            applyPose(frame);
            logPanel.innerText = `[TEST ACTIF : ${currentMethod}]\nTemps: ${currentVideoTime.toFixed(2)}s\n` + sysLogs;
        }
    }
    renderer.render(scene, camera);
}
animate();

// ==========================================
// 6. EVENT LISTENERS
// ==========================================
document.getElementById('btn-force-play').addEventListener('click', () => {
    isManualPlaying = !isManualPlaying;
    if(isManualPlaying) manualStartTime = Date.now() - (currentVideoTime * 1000);
});
document.getElementById('toggle-debug').addEventListener('click', (e) => {
    showDebugSpheres = !showDebugSpheres;
    debugSpheres.forEach(s => s.visible = showDebugSpheres);
});
document.getElementById('camZ').addEventListener('input', (e) => { camera.position.z = e.target.value; });
</script>
</body>
</html>

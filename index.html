<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype 3D Hdance - Flexible Bone Matching</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #111; color: #fff; font-family: sans-serif; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; font-size: 1.2rem; pointer-events: none; text-align: center; }

        #bottom-half { height: 250px; display: flex; background: #0a0a0a; }
        #controls-panel { width: 300px; padding: 20px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .slider-group { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #00ffcc; }
        input[type=range] { cursor: pointer; width: 100%; }
        
        .debug-toggle { background: #333; color: #fff; padding: 10px; border: 1px solid #555; cursor: pointer; font-weight: bold; }
        .debug-toggle.active { background: #00ffcc; color: #000; }

        #log-panel { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #0f0; white-space: pre-wrap;}
        .error-log { color: #ff4444; }
        .success-log { color: #00ffcc; }
    </style>
    
    <!-- Librairies Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- SDK Cloudflare Stream -->
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Chargement IA & 3D...<br><span id="loading-details" style="font-size: 0.8rem; color: #aaa;"></span></div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff; border-bottom:1px solid #333; padding-bottom:10px;">Réglages & Debug</h3>
        <button id="toggle-debug" class="debug-toggle active">Désactiver les sphères IA</button>
        <div class="slider-group">
            <label for="camZ">Zoom (Profondeur) : <span id="valZ">5</span>m</label>
            <input type="range" id="camZ" min="1" max="100" step="0.5" value="5">
        </div>
        <div class="slider-group">
            <label for="targetY">Hauteur (Cadrage Y) : <span id="valY">1.0</span></label>
            <input type="range" id="targetY" min="-5" max="10" step="0.1" value="1.0">
        </div>
    </div>
    <div id="log-panel">Initialisation du diagnostic...</div>
</div>

<script>
// ==========================================
// 1. MAPPING DE RECHERCHE FLEXIBLE
// ==========================================
const BONE_KEYWORDS = {
    hips: "Hips",
    spine: "Spine",
    neck: "Neck",
    head: "Head",
    
    leftShoulder: "LeftArm", 
    rightShoulder: "RightArm",
    leftElbow: "LeftForeArm",
    rightElbow: "RightForeArm",
    leftHand: "LeftHand",
    rightHand: "RightHand",

    leftHip: "LeftUpLeg",
    rightHip: "RightUpLeg",
    leftKnee: "LeftLeg",
    rightKnee: "RightLeg",
    leftAnkle: "LeftFoot",
    rightAnkle: "RightFoot"
};

// ==========================================
// 2. INITIALISATION THREE.JS & SPHÈRES DEBUG
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

let currentCamZ = 5; 
let currentTargetY = 1.0;
let showDebugSpheres = true;

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, currentTargetY, currentCamZ);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, currentTargetY, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(2, 5, 5);
scene.add(dirLight);

const gridHelper = new THREE.GridHelper(10, 10, 0x00ffcc, 0x333333);
gridHelper.position.y = -1;
scene.add(gridHelper);

// Création des 21 sphères de débogage pour visualiser le squelette JSON
const debugSpheres = [];
const sphereGeo = new THREE.SphereGeometry(0.05, 16, 16);
const materialLeft = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const materialRight = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
const materialCenter = new THREE.MeshBasicMaterial({ color: 0xffffff });

for(let i = 0; i < 21; i++) {
    let mat = materialCenter;
    if(i % 2 !== 0) mat = materialLeft;
    if(i > 0 && i % 2 === 0) mat = materialRight;
    
    const sphere = new THREE.Mesh(sphereGeo, mat);
    sphere.visible = true;
    scene.add(sphere);
    debugSpheres.push(sphere);
}

// ==========================================
// 3. CHARGEMENT DU GLB & MATCHING INTELLIGENT
// ==========================================
let avatarBones = {};
let diagnosticLogs = "";
let isModelLoaded = false;
let isJsonLoaded = false;

const logPanel = document.getElementById('log-panel');
const loadingDetails = document.getElementById('loading-details');
const loader = new THREE.GLTFLoader();

loadingDetails.innerText = "Téléchargement du GLB...";

loader.load('./free_female_mannequin_base_mesh_2.glb', (gltf) => {
    const model = gltf.scene;
    
    const shinyMaterial = new THREE.MeshStandardMaterial({
        color: 0x00aaff, metalness: 0.6, roughness: 0.2
    });

    const allNodes = [];
    model.traverse((child) => {
        if (child.isMesh) child.material = shinyMaterial;
        if (child.name) allNodes.push(child);
    });

    diagnosticLogs += "--- DIAGNOSTIC DES OS (RECHERCHE INTELLIGENTE) ---\n";
    let foundCount = 0;

    for (const [logicalName, keyword] of Object.entries(BONE_KEYWORDS)) {
        const matchedNode = allNodes.find(node => node.name.includes(keyword));
        
        if (matchedNode) {
            avatarBones[logicalName] = matchedNode;
            diagnosticLogs += `✅ ${logicalName} -> Associé à [${matchedNode.name}]\n`;
            foundCount++;
        } else {
            diagnosticLogs += `❌ ${logicalName} -> Mot-clé "${keyword}" introuvable\n`;
        }
    }

    diagnosticLogs += `\n-> Résultat : ${foundCount} os rattachés sur ${Object.keys(BONE_KEYWORDS).length}.\n\n`;

    model.position.y = -1;
    scene.add(model);
    isModelLoaded = true;
    checkReadyAndInit();
}, undefined, (err) => {
    loadingDetails.innerText = "ERREUR GLB ! Regardez la console.";
    console.error("Erreur GLB:", err);
});

// ==========================================
// 4. LECTURE JSON & LECTEUR CLOUDFLARE
// ==========================================
let posesData = [];
let currentVideoTime = 0; 
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('timeupdate', (event) => {
    currentVideoTime = event.currentTime;
});

loadingDetails.innerText = "Téléchargement du JSON...";

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(res => res.text())
    .then(text => {
        const lines = text.trim().split('\n');
        for(let i = 1; i < lines.length; i++) {
            posesData.push(JSON.parse(lines[i]));
        }
        diagnosticLogs += `✅ JSON MediaPipe chargé : ${posesData.length} frames.\n\n`;
        isJsonLoaded = true;
        checkReadyAndInit();
    })
    .catch(err => {
        diagnosticLogs += `❌ ERREUR JSON : ${err.message}\n`;
        logPanel.innerHTML = `<span class="error-log">${diagnosticLogs}</span>`;
    });

function checkReadyAndInit() {
    if (isModelLoaded && isJsonLoaded) {
        document.getElementById('loading').style.display = 'none';
        logPanel.innerHTML = `<span class="success-log">${diagnosticLogs}▶️ Tout est prêt ! Lancez la vidéo.</span>`;
        applyPose(posesData[0]); // Pose initiale à t=0
    }
}

// ==========================================
// 5. MOTEUR D'ANIMATION & QUATERNIONS
// ==========================================
function getMetricPoint(frameData, k) {
    const startIdx = 133 + (k * 3);
    return new THREE.Vector3(frameData[startIdx], -frameData[startIdx + 1], -frameData[startIdx + 2]);
}

function pointBoneTo(bone, startPos, endPos) {
    if(!bone || !startPos || !endPos) return;

    const targetDir = new THREE.Vector3().subVectors(endPos, startPos).normalize();
    const boneAxis = new THREE.Vector3(0, 1, 0); 
    const targetQuat = new THREE.Quaternion().setFromUnitVectors(boneAxis, targetDir);

    const parentQuat = new THREE.Quaternion();
    if (bone.parent) {
        bone.parent.updateWorldMatrix(true, false); 
        bone.parent.getWorldQuaternion(parentQuat);
    }
    
    const localQuat = parentQuat.invert().multiply(targetQuat);
    bone.quaternion.copy(localQuat);
}

function applyPose(frame) {
    if (!frame) return;

    // Mise à jour des sphères de debug 3D
    for(let i = 0; i < 21; i++) {
        const pt = getMetricPoint(frame, i);
        if(debugSpheres[i]) {
            debugSpheres[i].position.copy(pt);
        }
    }

    // Récupération des points clé MediaPipe
    const nose = getMetricPoint(frame, 0);
    const lShoulder = getMetricPoint(frame, 3);
    const rShoulder = getMetricPoint(frame, 4);
    const lElbow = getMetricPoint(frame, 5);
    const rElbow = getMetricPoint(frame, 6);
    const lWrist = getMetricPoint(frame, 7);
    const rWrist = getMetricPoint(frame, 8);
    const lIndex = getMetricPoint(frame, 9);
    const rIndex = getMetricPoint(frame, 10);
    const lHip = getMetricPoint(frame, 11);
    const rHip = getMetricPoint(frame, 12);
    const lKnee = getMetricPoint(frame, 13);
    const rKnee = getMetricPoint(frame, 14);
    const lAnkle = getMetricPoint(frame, 15);
    const rAnkle = getMetricPoint(frame, 16);
    const lFootIndex = getMetricPoint(frame, 19);
    const rFootIndex = getMetricPoint(frame, 20);

    const midHip = new THREE.Vector3().addVectors(lHip, rHip).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(lShoulder, rShoulder).multiplyScalar(0.5);

    // Orientation des os trouvés
    pointBoneTo(avatarBones.spine, midHip, midShoulder);
    pointBoneTo(avatarBones.neck, midShoulder, nose);

    pointBoneTo(avatarBones.leftShoulder, lShoulder, lElbow);
    pointBoneTo(avatarBones.rightShoulder, rShoulder, rElbow);
    pointBoneTo(avatarBones.leftElbow, lElbow, lWrist);
    pointBoneTo(avatarBones.rightElbow, rElbow, rWrist);
    pointBoneTo(avatarBones.leftHand, lWrist, lIndex);
    pointBoneTo(avatarBones.rightHand, rWrist, rIndex);

    pointBoneTo(avatarBones.leftHip, lHip, lKnee);
    pointBoneTo(avatarBones.rightHip, rHip, rKnee);
    pointBoneTo(avatarBones.leftKnee, lKnee, lAnkle);
    pointBoneTo(avatarBones.rightKnee, rKnee, rAnkle);
    pointBoneTo(avatarBones.leftAnkle, lAnkle, lFootIndex);
    pointBoneTo(avatarBones.rightAnkle, rAnkle, rFootIndex);
}

let lastLogTime = 0;
function animate() {
    requestAnimationFrame(animate);

    if (posesData.length > 0 && currentVideoTime > 0) {
        const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25)];
        
        if (frame) {
            applyPose(frame);

            if(Date.now() - lastLogTime > 250) {
                const ls = debugSpheres[3].position;
                logPanel.innerText = `[TÉLÉMÉTRIE EN DIRECT]\n`
                    + `▶ Vidéo Time: ${currentVideoTime.toFixed(3)}s | Frame JSON: ${frame[0].toFixed(3)}s\n\n`
                    + `--- POINT BRUT MEDIAPIPE (Épaule Gauche) ---\n`
                    + `X: ${ls.x.toFixed(3)} | Y: ${ls.y.toFixed(3)} | Z: ${ls.z.toFixed(3)}`;
                lastLogTime = Date.now();
            }
        }
    }

    renderer.render(scene, camera);
}

animate();

// ==========================================
// 6. GESTION DES ÉVÉNEMENTS HTML
// ==========================================
document.getElementById('toggle-debug').addEventListener('click', (e) => {
    showDebugSpheres = !showDebugSpheres;
    debugSpheres.forEach(s => s.visible = showDebugSpheres);
    e.target.innerText = showDebugSpheres ? "Désactiver les sphères IA" : "Activer les sphères IA";
    e.target.classList.toggle('active');
});

document.getElementById('camZ').addEventListener('input', (e) => {
    currentCamZ = parseFloat(e.target.value);
    camera.position.z = currentCamZ;
    document.getElementById('valZ').innerText = currentCamZ;
});

document.getElementById('targetY').addEventListener('input', (e) => {
    currentTargetY = parseFloat(e.target.value);
    controls.target.y = currentTargetY;
    camera.position.y = currentTargetY; 
    controls.update();
    document.getElementById('valY').innerText = currentTargetY.toFixed(1);
});

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype 3D Hdance - Live Monitor</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #111; color: #fff; font-family: sans-serif; 
            display: flex; overflow: hidden;
        }
        
        /* Colonne de gauche : Contrôles, Média & 3D */
        #left-col { 
            flex: 2; display: flex; flex-direction: column; 
        }

        /* Panneau de contrôles (Curseurs) */
        #controls-panel {
            background: #222; padding: 15px; display: flex; justify-content: center; gap: 30px;
            border-bottom: 2px solid #333; font-size: 14px;
        }
        .slider-group {
            display: flex; align-items: center; gap: 10px;
        }
        input[type=range] { cursor: pointer; }
        
        #video-container { 
            flex: 1; background: #000; border-bottom: 2px solid #333; 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        #canvas-container { 
            flex: 1; position: relative; 
        }
        #loading { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #00ffcc; font-weight: bold; font-size: 1.2rem; pointer-events: none; 
        }

        /* Colonne de droite : Moniteur Live */
        #right-col { 
            flex: 1; max-width: 400px; background: #1a1a1a; border-left: 2px solid #333; 
            padding: 20px; overflow-y: auto; font-family: monospace; font-size: 13px;
        }
        h3 { color: #00ffcc; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 0; }
        .data-box { background: #000; padding: 10px; border-radius: 5px; color: #0f0; margin-bottom: 20px; white-space: pre-wrap; }
    </style>
    
    <!-- Librairies Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- SDK Cloudflare Stream -->
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<!-- GAUCHE : CONTRÔLES, LECTEUR ET 3D -->
<div id="left-col">
    <!-- Barre de réglages de la caméra -->
    <div id="controls-panel">
        <div class="slider-group">
            <label for="camZ">Zoom (Profondeur) :</label>
            <input type="range" id="camZ" min="2" max="15" step="0.5" value="8">
        </div>
        <div class="slider-group">
            <label for="targetY">Hauteur (Cadrage) :</label>
            <input type="range" id="targetY" min="-2" max="4" step="0.1" value="1.5">
        </div>
    </div>

    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Chargement IA & 3D...</div>
    </div>
</div>

<!-- DROITE : MONITEUR DE DONNÉES -->
<div id="right-col">
    <h3>📡 Télémétrie en direct</h3>
    <div id="live-data" class="data-box">En attente de lecture...</div>

    <h3>🦴 Liste des os du GLB</h3>
    <div id="bone-list" class="data-box" style="color: #aaa;">Chargement du modèle...</div>
</div>

<script>
// ==========================================
// 1. CONFIGURATION & MAPPING
// ==========================================
// Mapping exact avec la liste fournie
const BONE_MAPPING = {
    leftShoulder: "mixamorigLeftArm_09", 
    rightShoulder: "mixamorigRightArm_033",
    leftElbow: "mixamorigLeftForeArm_010",
    rightElbow: "mixamorigRightForeArm_034",
    leftHip: "mixamorigLeftUpLeg_055",
    rightHip: "mixamorigRightUpLeg_060",
    leftKnee: "mixamorigLeftLeg_056",
    rightKnee: "mixamorigRightLeg_061"
};

// ==========================================
// 2. INITIALISATION THREE.JS
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

// Paramètres de départ (liés aux sliders HTML)
let currentCamZ = 8;
let currentTargetY = 1.5;

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, currentTargetY, currentCamZ);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, currentTargetY, 0);
controls.update();

// Lumières pour les reflets
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(2, 5, 3);
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x00ffcc, 5, 10);
pointLight.position.set(-2, 1, 2);
scene.add(pointLight);

// ==========================================
// 3. GESTION DES CURSEURS HTML
// ==========================================
document.getElementById('camZ').addEventListener('input', (e) => {
    currentCamZ = parseFloat(e.target.value);
    camera.position.z = currentCamZ;
});

document.getElementById('targetY').addEventListener('input', (e) => {
    currentTargetY = parseFloat(e.target.value);
    controls.target.y = currentTargetY;
    // On peut aussi ajuster la caméra sur l'axe Y pour un effet "ascenseur" propre
    camera.position.y = currentTargetY; 
    controls.update();
});

// ==========================================
// 4. CHARGEMENT DU GLB ET DES OS
// ==========================================
let avatarBones = {};
const loader = new THREE.GLTFLoader();

loader.load('free_female_mannequin_base_mesh.glb', (gltf) => {
    const model = gltf.scene;
    
    // Matériau esthétique (Reflets / Couleur)
    const shinyMaterial = new THREE.MeshStandardMaterial({
        color: 0x00aaff,
        metalness: 0.8,
        roughness: 0.1,
    });

    let extractedBones = [];

    model.traverse((child) => {
        if (child.isMesh) {
            child.material = shinyMaterial;
        }
        if (child.isBone) {
            avatarBones[child.name] = child;
            extractedBones.push(child.name);
        }
    });

    // Affichage des os trouvés dans le panneau de droite
    document.getElementById('bone-list').innerText = extractedBones.join('\n');

    model.position.y = -1; // Ajustement hauteur générale
    scene.add(model);
    document.getElementById('loading').style.display = 'none';
});

// ==========================================
// 5. LECTURE DU JSON ET SYNCHRONISATION
// ==========================================
let posesData = [];
const player = Stream(document.getElementById('stream-player'));

// Chargement des données JSON
fetch('AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(res => res.text())
    .then(text => {
        const lines = text.trim().split('\n');
        // On ignore la ligne 0 (En-tête JSON)
        for(let i = 1; i < lines.length; i++) {
            posesData.push(JSON.parse(lines[i]));
        }
    });

// Extraction d'un point métrique depuis la ligne (196 valeurs)
function getMetricPoint(frameData, k) {
    const startIdx = 133 + (k * 3);
    // Inversion Y et Z pour passer du repère MediaPipe au repère Three.js
    return new THREE.Vector3(
        frameData[startIdx],
        -frameData[startIdx + 1],
        -frameData[startIdx + 2]
    );
}

// Fonction de calcul d'orientation simplifiée (LookAt)
function pointBoneTo(bone, startPos, endPos) {
    if(!bone || !startPos || !endPos) return;
    const direction = new THREE.Vector3().subVectors(endPos, startPos).normalize();
    const targetPoint = new THREE.Vector3().addVectors(bone.position, direction);
    bone.lookAt(targetPoint);
}

// Boucle d'animation
function animate() {
    requestAnimationFrame(animate);

    // 1. Trouver la frame correspondante au temps de la vidéo
    if (posesData.length > 0 && player) {
        
        const currentTime = player.currentTime;
        
        if (typeof currentTime === 'number') {
            const frame = posesData.find(p => Math.abs(p[0] - currentTime) < 0.04) || posesData[Math.floor(currentTime * 25)];
            
            if (frame) {
                // Récupération des points métriques (Mètres)
                const lShoulder = getMetricPoint(frame, 3);
                const lElbow = getMetricPoint(frame, 5);
                const lWrist = getMetricPoint(frame, 7);

                const rShoulder = getMetricPoint(frame, 4);
                const rElbow = getMetricPoint(frame, 6);
                const rWrist = getMetricPoint(frame, 8);

                const lHip = getMetricPoint(frame, 11);
                const lKnee = getMetricPoint(frame, 13);
                const lAnkle = getMetricPoint(frame, 15);

                const rHip = getMetricPoint(frame, 12);
                const rKnee = getMetricPoint(frame, 14);
                const rAnkle = getMetricPoint(frame, 16);

                // Application de l'animation sur le GLB selon le mapping défini plus haut
                pointBoneTo(avatarBones[BONE_MAPPING.leftShoulder], lShoulder, lElbow);
                pointBoneTo(avatarBones[BONE_MAPPING.leftElbow], lElbow, lWrist);
                
                pointBoneTo(avatarBones[BONE_MAPPING.rightShoulder], rShoulder, rElbow);
                pointBoneTo(avatarBones[BONE_MAPPING.rightElbow], rElbow, rWrist);

                pointBoneTo(avatarBones[BONE_MAPPING.leftHip], lHip, lKnee);
                pointBoneTo(avatarBones[BONE_MAPPING.leftKnee], lKnee, lAnkle);

                pointBoneTo(avatarBones[BONE_MAPPING.rightHip], rHip, rKnee);
                pointBoneTo(avatarBones[BONE_MAPPING.rightKnee], rKnee, rAnkle);

                // Mise à jour du panneau de droite (Télémétrie en temps réel)
                document.getElementById('live-data').innerText = `⏱ Temps Vidéo : ${currentTime.toFixed(3)}s
🎬 Frame JSON  : ${frame[0].toFixed(2)}s

--- BASSIN / HANCHES (m) ---
Gauche : X:${lHip.x.toFixed(3)} Y:${lHip.y.toFixed(3)} Z:${lHip.z.toFixed(3)}
Droite : X:${rHip.x.toFixed(3)} Y:${rHip.y.toFixed(3)} Z:${rHip.z.toFixed(3)}

--- ÉPAULES (m) ---
Gauche : X:${lShoulder.x.toFixed(3)} Y:${lShoulder.y.toFixed(3)} Z:${lShoulder.z.toFixed(3)}
Droite : X:${rShoulder.x.toFixed(3)} Y:${rShoulder.y.toFixed(3)} Z:${rShoulder.z.toFixed(3)}`;
            }
        }
    }

    renderer.render(scene, camera);
}

// Lancement
animate();

// Responsivité du canevas 3D
window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>

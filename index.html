<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hdance - MetaHuman Differential Kinematics</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; text-align: center; }
        #bottom-half { height: 280px; display: flex; background: #0a0a0a; }
        #controls-panel { width: 300px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .btn-action { background: #00ffcc; color: #000; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-action:hover { background: #00cca3; }
        #log-panel { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #0f0; white-space: pre-wrap; line-height: 1.4; background: #050505;}
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Initialisation du moteur Delta...</div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff;">⚙️ Contrôles</h3>
        <button id="btn-force-play" class="btn-action">▶ Lancer Synchronisation</button>
        <button id="btn-debug-spheres" class="btn-action" style="background:#ffaa00; color:#000;">Afficher/Masquer Sphères IA</button>
        <button id="btn-recalibrate" class="btn-action" style="background:#cc00ff; color:#fff;">🔄 Recalibrer Position Initiale</button>
    </div>
    <div id="log-panel">Attente du modèle 1.glb...</div>
</div>

<script>
// ==========================================
// 1. DICTIONNAIRE EXACT META-HUMAN
// ==========================================
const BONE_DICTIONARY = {
    hips: "DHIbodypelvis_04",
    spine: "DHIbodyspine_01_05",
    neck: "DHIbodyneck_01_010",
    leftShoulder: "DHIbodyupperarm_l_014",
    rightShoulder: "DHIbodyupperarm_r_0145",
    leftElbow: "DHIbodylowerarm_l_015",
    rightElbow: "DHIbodylowerarm_r_0146",
    leftHip: "DHIbodythigh_l_0277",
    rightHip: "DHIbodythigh_r_0310",
    leftKnee: "DHIbodycalf_l_0278",
    rightKnee: "DHIbodycalf_r_0311"
};

// ==========================================
// 2. SCÈNE 3D
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 1.5, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(2, 5, 2);
scene.add(dirLight);
scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x222222));

const debugSpheres = [];
const sphereGeo = new THREE.SphereGeometry(0.02, 16, 16);
const matRed = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const matGreen = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

for(let i = 0; i < 21; i++) {
    const mesh = new THREE.Mesh(sphereGeo, i % 2 !== 0 ? matRed : matGreen);
    scene.add(mesh);
    debugSpheres.push(mesh);
}

// ==========================================
// 3. CHARGEMENT DU GLB & CAPTURE MATRICES
// ==========================================
let avatarModel = null;
let avatarBones = {};
const logPanel = document.getElementById('log-panel');

new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    if (gltf.animations) gltf.animations = [];

    // Force la mise à jour des matrices pour capturer l'état "A-Pose / T-Pose"
    avatarModel.updateMatrixWorld(true);

    avatarModel.traverse((node) => {
        if (node.isBone) {
            for (const [logicalName, exactName] of Object.entries(BONE_DICTIONARY)) {
                if (node.name === exactName) {
                    avatarBones[logicalName] = node;
                    
                    // On sauvegarde le Quaternion GLOBAL de repos de chaque os
                    node.userData.initialWorldQuat = new THREE.Quaternion();
                    node.getWorldQuaternion(node.userData.initialWorldQuat);
                }
            }
        }
    });

    const bbox = new THREE.Box3().setFromObject(avatarModel);
    const size = bbox.getSize(new THREE.Vector3());
    if (size.y > 0) avatarModel.scale.setScalar(1.7 / size.y);

    avatarModel.position.set(0, 0, 0);
    scene.add(avatarModel);
    
    document.getElementById('loading').style.display = 'none';
    logPanel.innerText = `✅ Modèle MetaHuman chargé.\nMatrices globales de repos capturées.`;
});

// ==========================================
// 4. LECTURE JSON & VIDÉO
// ==========================================
let posesData = [];
let currentVideoTime = 0, isManualPlaying = false, manualStartTime = 0;
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('play', () => { isManualPlaying = true; manualStartTime = Date.now() - (currentVideoTime * 1000); });
player.addEventListener('timeupdate', (e) => { if(e.currentTime > 0) currentVideoTime = e.currentTime; });

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(r => r.text())
    .then(text => {
        text.trim().split('\n').slice(1).forEach(l => posesData.push(JSON.parse(l)));
    });

// ==========================================
// 5. MOTEUR DIFFÉRENTIEL (Le cœur du secret)
// ==========================================
let baseVectors = null;

function getPoint(frame, k) {
    const idx = 133 + (k * 3);
    return new THREE.Vector3(frame[idx], -frame[idx+1], -frame[idx+2]);
}

// Fonction pour capturer la "pose neutre" de la vidéo à la Frame 0
function captureBasePose(frame) {
    baseVectors = {};
    
    const sL = getPoint(frame, 3), sR = getPoint(frame, 4);
    const hL = getPoint(frame, 11), hR = getPoint(frame, 12);
    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    // On enregistre les vecteurs de direction initiaux de l'acteur
    baseVectors.spine = new THREE.Vector3().subVectors(midShoulder, midHip).normalize();
    baseVectors.neck = new THREE.Vector3().subVectors(getPoint(frame, 0), midShoulder).normalize();
    baseVectors.leftShoulder = new THREE.Vector3().subVectors(getPoint(frame, 5), sL).normalize();
    baseVectors.rightShoulder = new THREE.Vector3().subVectors(getPoint(frame, 6), sR).normalize();
    baseVectors.leftElbow = new THREE.Vector3().subVectors(getPoint(frame, 7), getPoint(frame, 5)).normalize();
    baseVectors.rightElbow = new THREE.Vector3().subVectors(getPoint(frame, 8), getPoint(frame, 6)).normalize();
    
    baseVectors.leftHip = new THREE.Vector3().subVectors(getPoint(frame, 13), hL).normalize();
    baseVectors.rightHip = new THREE.Vector3().subVectors(getPoint(frame, 14), hR).normalize();
    baseVectors.leftKnee = new THREE.Vector3().subVectors(getPoint(frame, 15), getPoint(frame, 13)).normalize();
    baseVectors.rightKnee = new THREE.Vector3().subVectors(getPoint(frame, 16), getPoint(frame, 14)).normalize();

    logPanel.innerText += `\n🎯 Calibrage vidéo terminé ! (Vecteurs de référence verrouillés).`;
}

// Application du Delta
function applyDeltaKinematics(bone, logicalName, pStart, pEnd) {
    if (!bone || !baseVectors[logicalName] || !pStart || !pEnd) return;
    
    // 1. Vecteur actuel de l'acteur
    const currentDir = new THREE.Vector3().subVectors(pEnd, pStart).normalize();
    
    // 2. Calcul du delta (Quelle rotation l'acteur a fait depuis la Frame 0 ?)
    const deltaQuat = new THREE.Quaternion().setFromUnitVectors(baseVectors[logicalName], currentDir);
    
    // 3. On applique ce Delta mathématique EXACT à l'orientation globale de base du modèle 3D
    const targetWorldQuat = deltaQuat.clone().multiply(bone.userData.initialWorldQuat);
    
    // 4. On reconvertit en Quaternion Local pour Three.js
    const parentWorldQuat = new THREE.Quaternion();
    if (bone.parent) bone.parent.getWorldQuaternion(parentWorldQuat);
    
    const localTargetQuat = parentWorldQuat.invert().multiply(targetWorldQuat);
    
    // 5. Application douce (slerp) pour éviter les micro-saccades
    bone.quaternion.slerp(localTargetQuat, 0.6);
}

function applyPose(frame) {
    if (!frame || !avatarModel) return;

    if (!baseVectors) captureBasePose(frame);

    for(let i = 0; i < 21; i++) {
        const pt = getPoint(frame, i);
        if(debugSpheres[i]) debugSpheres[i].position.copy(pt);
    }

    const nose = getPoint(frame, 0);
    const sL = getPoint(frame, 3), sR = getPoint(frame, 4);
    const eL = getPoint(frame, 5), eR = getPoint(frame, 6);
    const wL = getPoint(frame, 7), wR = getPoint(frame, 8);
    const hL = getPoint(frame, 11), hR = getPoint(frame, 12);
    const kL = getPoint(frame, 13), kR = getPoint(frame, 14);
    
    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    // Déplacement dynamique du bassin
    if (avatarBones.hips) {
        if(avatarBones.hips.parent) {
            const localHipPos = avatarBones.hips.parent.worldToLocal(midHip.clone());
            avatarBones.hips.position.lerp(localHipPos, 0.8);
        } else {
            avatarBones.hips.position.lerp(midHip, 0.8);
        }
    }

    // Application pure des différences de rotation
    applyDeltaKinematics(avatarBones.spine, 'spine', midHip, midShoulder);
    applyDeltaKinematics(avatarBones.neck, 'neck', midShoulder, nose);
    
    applyDeltaKinematics(avatarBones.leftShoulder, 'leftShoulder', sL, eL);
    applyDeltaKinematics(avatarBones.leftElbow, 'leftElbow', eL, wL);
    applyDeltaKinematics(avatarBones.rightShoulder, 'rightShoulder', sR, eR);
    applyDeltaKinematics(avatarBones.rightElbow, 'rightElbow', eR, wR);
    
    applyDeltaKinematics(avatarBones.leftHip, 'leftHip', hL, kL);
    applyDeltaKinematics(avatarBones.leftKnee, 'leftKnee', kL, getPoint(frame, 15));
    applyDeltaKinematics(avatarBones.rightHip, 'rightHip', hR, kR);
    applyDeltaKinematics(avatarBones.rightKnee, 'rightKnee', kR, getPoint(frame, 16));
}

function animate() {
    requestAnimationFrame(animate);
    if (posesData.length > 0 && isManualPlaying) {
        currentVideoTime = (Date.now() - manualStartTime) / 1000;
        const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25) % posesData.length];
        if (frame) applyPose(frame);
    }
    renderer.render(scene, camera);
}
animate();

// ==========================================
// 6. ÉVÉNEMENTS HTML
// ==========================================
document.getElementById('btn-force-play').addEventListener('click', () => {
    isManualPlaying = !isManualPlaying;
    if(isManualPlaying) manualStartTime = Date.now() - (currentVideoTime * 1000);
});

let spheresVisible = true;
document.getElementById('btn-debug-spheres').addEventListener('click', (e) => {
    spheresVisible = !spheresVisible;
    debugSpheres.forEach(s => s.visible = spheresVisible);
});

document.getElementById('btn-recalibrate').addEventListener('click', () => {
    baseVectors = null;
    logPanel.innerText += `\n🔄 Relance du calibrage sur la position actuelle de la vidéo...`;
});
</script>

</body>
</html>

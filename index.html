<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC Hdance - Deform Bones Target</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: #111; color: #fff; font-family: sans-serif; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; font-size: 1.2rem; pointer-events: none; text-align: center; }

        #bottom-half { height: 280px; display: flex; background: #0a0a0a; }
        #controls-panel { width: 340px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .slider-group { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #00ffcc; }
        input[type=range] { cursor: pointer; width: 100%; }
        
        .btn-action { background: #00ffcc; color: #000; padding: 8px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 12px; }
        .btn-action:hover { background: #00cca3; }

        #log-panel { flex: 1; padding: 12px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; color: #00ff66; white-space: pre-wrap; line-height: 1.4; background: #050505; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Ciblage des os de déformation...<br><span id="loading-details" style="font-size: 0.8rem; color: #aaa;"></span></div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff; border-bottom:1px solid #333; padding-bottom:5px; font-size:14px;">🛠 Réglages</h3>
        
        <button id="btn-force-play" class="btn-action">▶ Démarrer Animation 3D</button>
        <button id="toggle-debug-ia" class="btn-action" style="background:#444; color:#fff;">👁 Masquer IA (Rouge/Vert)</button>
        <button id="toggle-debug-glb" class="btn-action" style="background:#ffaa00; color:#000;">🦴 Afficher Os (Lignes)</button>
        
        <div class="slider-group" style="margin-top: 10px;">
            <label for="camZ">Zoom : <span id="valZ">3.0</span>m</label>
            <input type="range" id="camZ" min="0.5" max="10" step="0.1" value="3.0">
        </div>
    </div>
    <div id="log-panel">Attente du chargement...</div>
</div>

<script>
// ==========================================
// 1. MAPPING FLEXIBLE
// ==========================================
const BONE_KEYWORDS = {
    hips: "Hips", spine: "Spine", neck: "Neck", head: "Head",
    leftShoulder: "LeftArm", rightShoulder: "RightArm",
    leftElbow: "LeftForeArm", rightElbow: "RightForeArm",
    leftHip: "LeftUpLeg", rightHip: "RightUpLeg",
    leftKnee: "LeftLeg", rightKnee: "RightLeg"
};

// ==========================================
// 2. SCÈNE 3D & WRAPPER
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 1.0, 3.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.update();

scene.add(new THREE.AmbientLight(0x404050, 1.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);
scene.add(new THREE.GridHelper(10, 10, 0x00ffcc, 0x333333));

const debugSpheresIA = [];
const sphereGeoIA = new THREE.SphereGeometry(0.025, 16, 16);
const matRed = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const matGreen = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

for(let i=0; i<21; i++) {
    const mesh = new THREE.Mesh(sphereGeoIA, i%2 !== 0 ? matRed : matGreen);
    scene.add(mesh);
    debugSpheresIA.push(mesh);
}

// ==========================================
// 3. CIBLAGE DES OS DE DÉFORMATION (SKIN BONES)
// ==========================================
let avatarModel = null, avatarBones = {};
let isModelLoaded = false, isJsonLoaded = false;
let glbSkeletonHelper = null;
const logPanel = document.getElementById('log-panel');
let sysLogs = "=== ETAT DU CHARGEMENT ===\n";

new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    gltf.animations = [];
    
    let targetSkeleton = null;

    avatarModel.traverse((child) => {
        if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({ color: 0x0088cc, roughness: 0.3 });
            if (child.isSkinnedMesh && child.skeleton) {
                targetSkeleton = child.skeleton;
            }
        }
    });

    if (targetSkeleton) {
        sysLogs += `✔ Squelette de peau détecté (${targetSkeleton.bones.length} os de déformation purs)\n`;
        // 🔴 RECHERCHE EXCLUSIVE DANS LES OS ATTACHÉS À LA PEAU 🔴
        for (const [logic, key] of Object.entries(BONE_KEYWORDS)) {
            // Priorité aux os nommés "DEF-" (Deform) typiques de Rigify
            let match = targetSkeleton.bones.find(n => n.name.toLowerCase().includes("def") && n.name.toLowerCase().includes(key.toLowerCase()));
            
            // Si pas de DEF-, recherche classique dans la liste de la peau
            if (!match) {
                match = targetSkeleton.bones.find(n => n.name.toLowerCase().includes(key.toLowerCase()));
            }
            
            if(match) avatarBones[logic] = match;
        }
        sysLogs += `✔ Os de contrôle isolés et mappés.\n`;
    } else {
        sysLogs += `❌ ERREUR : Aucun SkinnedMesh trouvé dans le modèle.\n`;
    }

    glbSkeletonHelper = new THREE.SkeletonHelper(avatarModel);
    glbSkeletonHelper.visible = false;
    scene.add(glbSkeletonHelper);
    
    // Normalisation de la taille
    const bbox = new THREE.Box3().setFromObject(avatarModel);
    const size = bbox.getSize(new THREE.Vector3());
    if (size.y > 0) {
        const scaleFactor = 1.7 / size.y;
        avatarModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
    }
    
    scene.add(avatarModel);
    isModelLoaded = true;
    checkReady();
});

let posesData = [];
let currentVideoTime = 0, isManualPlaying = false, manualStartTime = 0;
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('play', () => { isManualPlaying = true; manualStartTime = Date.now() - (currentVideoTime * 1000); });
player.addEventListener('timeupdate', (e) => { if(e.currentTime > 0) currentVideoTime = e.currentTime; });

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(r => r.text()).then(text => {
        text.trim().split('\n').slice(1).forEach(l => posesData.push(JSON.parse(l)));
        isJsonLoaded = true; checkReady();
    });

function checkReady() {
    if (isModelLoaded && isJsonLoaded) {
        document.getElementById('loading').style.display = 'none';
        sysLogs += "✔ Prêt à animer.";
        logPanel.innerText = sysLogs;
    }
}

// ==========================================
// 4. MOTEUR D'ANIMATION
// ==========================================
function getMetricPoint(frame, k) {
    const idx = 133 + (k * 3);
    return new THREE.Vector3(frame[idx], -frame[idx+1], -frame[idx+2]);
}

function applyRotation(bone, startPos, endPos, axis) {
    if(!bone || !startPos || !endPos) return;
    
    const dir = new THREE.Vector3().subVectors(endPos, startPos).normalize();
    const targetQuat = new THREE.Quaternion().setFromUnitVectors(axis, dir);

    if (bone.parent) {
        bone.parent.updateMatrixWorld(true);
        const pQuat = new THREE.Quaternion();
        bone.parent.getWorldQuaternion(pQuat);
        targetQuat.premultiply(pQuat.invert());
    }
    
    bone.quaternion.copy(targetQuat);
    bone.updateMatrixWorld(true);
}

function applyPose(frame) {
    if (!frame) return;

    for(let i=0; i<21; i++) {
        const pt = getMetricPoint(frame, i);
        if(debugSpheresIA[i]) debugSpheresIA[i].position.copy(pt);
    }

    const midHip = new THREE.Vector3().addVectors(getMetricPoint(frame, 11), getMetricPoint(frame, 12)).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(getMetricPoint(frame, 3), getMetricPoint(frame, 4)).multiplyScalar(0.5);

    if (avatarModel) {
        avatarModel.position.copy(midHip);
    }

    const axisY = new THREE.Vector3(0, 1, 0);
    const axisX = new THREE.Vector3(1, 0, 0);
    const axisNX = new THREE.Vector3(-1, 0, 0);

    applyRotation(avatarBones.spine, midHip, midShoulder, axisY);
    applyRotation(avatarBones.neck, midShoulder, getMetricPoint(frame, 0), axisY);
    applyRotation(avatarBones.leftShoulder, getMetricPoint(frame, 3), getMetricPoint(frame, 5), axisX);
    applyRotation(avatarBones.rightShoulder, getMetricPoint(frame, 4), getMetricPoint(frame, 6), axisNX);
    applyRotation(avatarBones.leftElbow, getMetricPoint(frame, 5), getMetricPoint(frame, 7), axisX);
    applyRotation(avatarBones.rightElbow, getMetricPoint(frame, 6), getMetricPoint(frame, 8), axisNX);

    if(glbSkeletonHelper) glbSkeletonHelper.update();
}

function animate() {
    requestAnimationFrame(animate);

    if (posesData.length > 0) {
        if(isManualPlaying) currentVideoTime = (Date.now() - manualStartTime) / 1000;
        const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25) % posesData.length];
        
        if (frame) {
            applyPose(frame);
            if(Math.floor(currentVideoTime * 10) % 5 === 0) {
                logPanel.innerText = `▶ Animation Active (Temps: ${currentVideoTime.toFixed(2)}s)\nRecherche effectuée uniquement sur les os de déformation (DEF-).`;
            }
        }
    }
    renderer.render(scene, camera);
}
animate();

// ==========================================
// 5. EVENT LISTENERS
// ==========================================
document.getElementById('btn-force-play').addEventListener('click', () => {
    isManualPlaying = !isManualPlaying;
    if(isManualPlaying) manualStartTime = Date.now() - (currentVideoTime * 1000);
    document.getElementById('btn-force-play').innerText = isManualPlaying ? "⏸ Pause 3D" : "▶ Démarrer Animation 3D";
});

let showIA = true;
document.getElementById('toggle-debug-ia').addEventListener('click', (e) => {
    showIA = !showIA;
    debugSpheresIA.forEach(s => s.visible = showIA);
    e.target.innerText = showIA ? "👁 Masquer IA (Rouge/Vert)" : "👁 Afficher IA (Rouge/Vert)";
});

let showGLB = false;
document.getElementById('toggle-debug-glb').addEventListener('click', (e) => {
    showGLB = !showGLB;
    if(glbSkeletonHelper) glbSkeletonHelper.visible = showGLB;
    e.target.innerText = showGLB ? "🦴 Masquer Os (Lignes)" : "🦴 Afficher Os (Lignes)";
});

document.getElementById('camZ').addEventListener('input', (e) => { camera.position.z = e.target.value; });
</script>
</body>
</html>

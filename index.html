<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hdance - BlazeWild Kinematics Approach</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; text-align: center; }
        #bottom-half { height: 250px; display: flex; background: #0a0a0a; }
        #controls-panel { width: 300px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .btn-action { background: #00ffcc; color: #000; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-action:hover { background: #00cca3; }
        #log-panel { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #0f0; white-space: pre-wrap; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Initialisation du moteur BlazeWild...</div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff;">⚙️ Contrôles</h3>
        <button id="btn-force-play" class="btn-action">▶ Lancer Synchronisation</button>
        <button id="btn-debug" class="btn-action" style="background:#444; color:#fff;">Afficher Helper Squelette</button>
    </div>
    <div id="log-panel">Attente du modèle 1.glb...</div>
</div>

<script>
// Dictionnaire étendu (Standard, Mixamo, ReadyPlayerMe)
const BONE_DICTIONARY = {
    hips: ["Hips", "pelvis", "mixamorigHips"],
    spine: ["Spine", "spine_01", "mixamorigSpine"],
    neck: ["Neck", "neck_01", "mixamorigNeck"],
    leftShoulder: ["LeftArm", "upperarm_l", "mixamorigLeftArm"],
    rightShoulder: ["RightArm", "upperarm_r", "mixamorigRightArm"],
    leftElbow: ["LeftForeArm", "lowerarm_l", "mixamorigLeftForeArm"],
    rightElbow: ["RightForeArm", "lowerarm_r", "mixamorigRightForeArm"],
    leftHip: ["LeftUpLeg", "thigh_l", "mixamorigLeftUpLeg"],
    rightHip: ["RightUpLeg", "thigh_r", "mixamorigRightUpLeg"],
    leftKnee: ["LeftLeg", "calf_l", "mixamorigLeftLeg"],
    rightKnee: ["RightLeg", "calf_r", "mixamorigRightLeg"]
};

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 1, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(2, 5, 2);
scene.add(dirLight);
scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x222222));

let avatarModel = null;
let avatarBones = {};
let skeletonHelper = null;
const logPanel = document.getElementById('log-panel');

// Chargement pur sans forcer le bindMode
new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    
    // Nettoyage des animations parasites
    if (gltf.animations) gltf.animations = [];

    // Recherche récursive des os
    avatarModel.traverse((node) => {
        if (node.isBone) {
            for (const [logicalName, keywords] of Object.entries(BONE_DICTIONARY)) {
                if (keywords.some(kw => node.name.toLowerCase().includes(kw.toLowerCase()))) {
                    avatarBones[logicalName] = node;
                }
            }
        }
    });

    skeletonHelper = new THREE.SkeletonHelper(avatarModel);
    skeletonHelper.visible = false;
    scene.add(skeletonHelper);

    // Ajustement de l'échelle globalement
    const bbox = new THREE.Box3().setFromObject(avatarModel);
    const size = bbox.getSize(new THREE.Vector3());
    if (size.y > 0) avatarModel.scale.setScalar(1.7 / size.y);

    scene.add(avatarModel);
    document.getElementById('loading').style.display = 'none';
    logPanel.innerText = `✅ 1.glb Chargé.\nOs trouvés : ${Object.keys(avatarBones).length} / 11`;
});

let posesData = [];
let currentVideoTime = 0, isManualPlaying = false, manualStartTime = 0;
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('play', () => { isManualPlaying = true; manualStartTime = Date.now() - (currentVideoTime * 1000); });
player.addEventListener('timeupdate', (e) => { if(e.currentTime > 0) currentVideoTime = e.currentTime; });

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(r => r.text())
    .then(text => {
        text.trim().split('\n').slice(1).forEach(l => posesData.push(JSON.parse(l)));
    });

// Utilitaires Kinématiques (Inspirés de l'adaptateur de BlazeWild)
function getPoint(frame, k) {
    const idx = 133 + (k * 3);
    return new THREE.Vector3(frame[idx], -frame[idx+1], -frame[idx+2]);
}

function applyKinematics(bone, pStart, pEnd, refAxis) {
    if (!bone || !pStart || !pEnd) return;
    
    // Calcul du vecteur de direction dans l'espace global
    const direction = new THREE.Vector3().subVectors(pEnd, pStart).normalize();
    const globalQuat = new THREE.Quaternion().setFromUnitVectors(refAxis, direction);

    // Transformation en espace local pour ne pas détruire le squelette
    const parentQuat = new THREE.Quaternion();
    if (bone.parent && bone.parent.isBone) {
        bone.parent.getWorldQuaternion(parentQuat);
        globalQuat.premultiply(parentQuat.invert());
    }
    
    // Application douce par slerp (pseudo-Kalman) ou directe
    bone.quaternion.slerp(globalQuat, 0.8);
}

function applyPose(frame) {
    if (!frame || !avatarModel) return;

    const hL = getPoint(frame, 11), hR = getPoint(frame, 12);
    const sL = getPoint(frame, 3), sR = getPoint(frame, 4);
    
    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    // Repositionnement global via le parent principal
    avatarModel.position.copy(midHip);

    const axisY = new THREE.Vector3(0, 1, 0);
    const axisX = new THREE.Vector3(1, 0, 0);
    const axisNX = new THREE.Vector3(-1, 0, 0);

    applyKinematics(avatarBones.spine, midHip, midShoulder, axisY);
    applyKinematics(avatarBones.neck, midShoulder, getPoint(frame, 0), axisY);
    applyKinematics(avatarBones.leftShoulder, sL, getPoint(frame, 5), axisX);
    applyKinematics(avatarBones.rightShoulder, sR, getPoint(frame, 6), axisNX);
    applyKinematics(avatarBones.leftElbow, getPoint(frame, 5), getPoint(frame, 7), axisX);
    applyKinematics(avatarBones.rightElbow, getPoint(frame, 6), getPoint(frame, 8), axisNX);
    applyKinematics(avatarBones.leftHip, hL, getPoint(frame, 13), axisY);
    applyKinematics(avatarBones.rightHip, hR, getPoint(frame, 14), axisY);
    applyKinematics(avatarBones.leftKnee, getPoint(frame, 13), getPoint(frame, 15), axisY);
    applyKinematics(avatarBones.rightKnee, getPoint(frame, 14), getPoint(frame, 16), axisY);

    if(skeletonHelper) skeletonHelper.update();
}

function animate() {
    requestAnimationFrame(animate);
    if (posesData.length > 0 && isManualPlaying) {
        currentVideoTime = (Date.now() - manualStartTime) / 1000;
        const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25) % posesData.length];
        if (frame) applyPose(frame);
    }
    renderer.render(scene, camera);
}
animate();

document.getElementById('btn-force-play').addEventListener('click', () => {
    isManualPlaying = !isManualPlaying;
    if(isManualPlaying) manualStartTime = Date.now() - (currentVideoTime * 1000);
});

document.getElementById('btn-debug').addEventListener('click', (e) => {
    if(skeletonHelper) {
        skeletonHelper.visible = !skeletonHelper.visible;
        e.target.innerText = skeletonHelper.visible ? "Masquer Helper Squelette" : "Afficher Helper Squelette";
    }
});
</script>

</body>
</html>

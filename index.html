<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hdance - Diagnostic GLB Intégré</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; text-align: center; z-index: 5; }
        #bottom-half { height: 280px; display: flex; background: #0a0a0a; }
        #controls-panel { width: 300px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .btn-action { background: #00ffcc; color: #000; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-action:hover { background: #00cca3; }
        #log-panel { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #0f0; white-space: pre-wrap; line-height: 1.4; background: #050505;}
        
        /* Styles pour la Pop-up */
        #diagnostic-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        #diagnostic-content { background: #111; border: 2px solid #cc00ff; border-radius: 8px; width: 80%; height: 80%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #diagnostic-textarea { flex: 1; background: #050505; color: #00ff66; font-family: 'Courier New', monospace; font-size: 13px; padding: 15px; border: 1px solid #333; overflow-y: auto; white-space: pre-wrap; resize: none; margin-bottom: 15px; }
        .btn-close { background: #ff4444; color: #fff; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; align-self: flex-end; }
        .btn-close:hover { background: #cc0000; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<!-- Fenêtre Pop-up Modale -->
<div id="diagnostic-modal">
    <div id="diagnostic-content">
        <h2 style="color: #cc00ff; margin-top: 0;">🔍 Scanner d'Armature GLB</h2>
        <p style="color: #aaa; font-size: 14px; margin-top: 0;">Copie l'intégralité du texte vert ci-dessous et colle-le dans la conversation.</p>
        <textarea id="diagnostic-textarea" readonly>Analyse en cours...</textarea>
        <button id="btn-close-modal" class="btn-close">Fermer la fenêtre</button>
    </div>
</div>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Initialisation du diagnostic...</div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff;">⚙️ Contrôles</h3>
        <button id="btn-force-play" class="btn-action">▶ Lancer Synchronisation</button>
        <button id="btn-debug-spheres" class="btn-action" style="background:#ffaa00; color:#000;">Afficher/Masquer Sphères IA</button>
        <!-- Bouton Diagnostic -->
        <button id="btn-diagnostic" class="btn-action" style="background:#cc00ff; color:#fff; border: 1px solid #fff;">📊 Extraire Squelette GLB</button>
    </div>
    <div id="log-panel">Attente du modèle 1.glb...</div>
</div>

<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 1.5, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(2, 5, 2);
scene.add(dirLight);
scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x222222));

let avatarModel = null;
const logPanel = document.getElementById('log-panel');

new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    if (gltf.animations) gltf.animations = [];

    const bbox = new THREE.Box3().setFromObject(avatarModel);
    const size = bbox.getSize(new THREE.Vector3());
    if (size.y > 0) avatarModel.scale.setScalar(1.7 / size.y);

    avatarModel.position.set(0, 0, 0);
    scene.add(avatarModel);
    
    document.getElementById('loading').style.display = 'none';
    logPanel.innerHTML = `<span style="color:#00ffcc">✅ Modèle 1.glb chargé.</span>\nClique sur "Extraire Squelette GLB" pour générer le rapport.`;
});

// ==========================================
// OUTIL DE DIAGNOSTIC (Pop-up)
// ==========================================
const diagnosticModal = document.getElementById('diagnostic-modal');
const diagnosticTextarea = document.getElementById('diagnostic-textarea');

function generateDiagnosticReport() {
    if (!avatarModel) return "Erreur : Le modèle 1.glb n'est pas encore chargé.";
    
    let report = "=========================================\n";
    report += "       DIAGNOSTIC DU FICHIER 1.GLB       \n";
    report += "=========================================\n\n";

    report += "--- 1. HIÉRARCHIE COMPLÈTE DU MODÈLE ---\n";
    
    function buildTree(node, depth = 0) {
        const indent = "│   ".repeat(depth);
        const isBone = node.isBone ? " 🦴 [BONE]" : "";
        const isMesh = node.isSkinnedMesh ? " 👻 [SKINNED MESH]" : (node.isMesh ? " 🧊 [MESH]" : "");
        
        let nodeInfo = `${indent}├─ ${node.name || 'Unnamed'} (${node.type})${isBone}${isMesh}`;
        
        if (node.isSkinnedMesh && node.skeleton) {
            nodeInfo += ` -> Attaché à un squelette de ${node.skeleton.bones.length} os.`;
        }
        
        report += nodeInfo + "\n";
        node.children.forEach(child => buildTree(child, depth + 1));
    }
    
    buildTree(avatarModel);

    report += "\n--- 2. LISTE PLATE DES OS (Bones) ---\n";
    const bonesList = [];
    avatarModel.traverse((node) => {
        if (node.isBone) bonesList.push(node.name);
    });

    if (bonesList.length === 0) {
        report += "ERREUR CRITIQUE : Aucun objet de type 'Bone' détecté. Le fichier n'est pas riggé pour Three.js.\n";
    } else {
        bonesList.forEach((b, i) => report += `${i + 1}. ${b}\n`);
        report += `\nTotal : ${bonesList.length} os détectés.\n`;
    }
    
    return report;
}

document.getElementById('btn-diagnostic').addEventListener('click', () => {
    diagnosticTextarea.value = generateDiagnosticReport();
    diagnosticModal.style.display = "flex";
});

document.getElementById('btn-close-modal').addEventListener('click', () => {
    diagnosticModal.style.display = "none";
});

// ==========================================
// RENDER LOOP BAsique (pour garder la caméra active)
// ==========================================
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hdance - Stabilisation Chevilles & Talons</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        #top-half { display: flex; flex: 1; border-bottom: 2px solid #333; min-height: 0; }
        #video-container { flex: 1; background: #000; border-right: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; border: 1px solid #00ffcc; z-index: 10;}
        #bottom-half { height: 200px; display: flex; background: #0a0a0a; border-top: 2px solid #333; z-index: 5; }
        #controls-panel { width: 300px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .btn-action { background: #00ffcc; color: #000; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; pointer-events: auto; }
        .btn-action:hover { background: #00cca3; }
        #log-panel { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #0f0; white-space: pre-wrap; line-height: 1.4; background: #050505;}
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="top-half">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Stabilisation des chevilles & calage des pieds au sol...</div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff;">⚙️ Contrôles</h3>
        <p style="font-size: 11px; color: #aaa; margin: 0;">Pieds stabilisés à plat. Talons verrouillés sur Y=0.</p>
        <button id="btn-debug-skeleton" class="btn-action" style="background:#ffaa00; color:#000; margin-top: 10px;">🦴 Afficher Lignes Squelette</button>
        <button id="btn-toggle-mesh" class="btn-action" style="background:#444; color:#fff;">👻 Masquer la peau 3D</button>
    </div>
    <div id="log-panel">Attente de la connexion avec le lecteur Cloudflare...</div>
</div>

<script>
// ==========================================
// 1. DICTIONNAIRE EXACT META-HUMAN
// ==========================================
const BONE_DICTIONARY = {
    hips: "DHIbodypelvis_04", spine: "DHIbodyspine_01_05", neck: "DHIbodyneck_01_010", head: "DHIbodyhead_012",
    leftShoulder: "DHIbodyupperarm_l_014", rightShoulder: "DHIbodyupperarm_r_0145",
    leftElbow: "DHIbodylowerarm_l_015", rightElbow: "DHIbodylowerarm_r_0146",
    leftHand: "DHIbodyhand_l_016", rightHand: "DHIbodyhand_r_0147",
    leftHip: "DHIbodythigh_l_0277", rightHip: "DHIbodythigh_r_0310",
    leftKnee: "DHIbodycalf_l_0278", rightKnee: "DHIbodycalf_r_0311",
    leftFoot: "DHIbodyfoot_l_0279", rightFoot: "DHIbodyfoot_r_0312"
};

// ==========================================
// 2. SCÈNE 3D & STUDIO
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 1.4, 5.0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x2a2a2c); 
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);

function buildStudioFace() {
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
    scene.add(ambientLight);

    const spotLight = new THREE.SpotLight(0xfff0dd, 1.3);
    spotLight.position.set(0, 6, 4);
    spotLight.angle = Math.PI / 3;
    spotLight.penumbra = 0.5;
    spotLight.castShadow = true;
    spotLight.shadow.mapSize.width = 2048;
    spotLight.shadow.mapSize.height = 2048;
    scene.add(spotLight);

    const fillLight = new THREE.DirectionalLight(0x88aacc, 0.3);
    fillLight.position.set(-4, 3, 3);
    scene.add(fillLight);

    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x5a5855, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 1.0 });
    const wallBackGeo = new THREE.PlaneGeometry(30, 15);
    const wallBack = new THREE.Mesh(wallBackGeo, wallMat);
    wallBack.position.set(0, 7.5, -4);
    wallBack.receiveShadow = true;
    scene.add(wallBack);

    const rugGeo = new THREE.PlaneGeometry(3.5, 2.0);
    const rugMat = new THREE.MeshStandardMaterial({ color: 0xe0dcd3, roughness: 0.9 });
    const rug = new THREE.Mesh(rugGeo, rugMat);
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, 0.01, 0.5);
    rug.receiveShadow = true;
    scene.add(rug);

    const sofaGeo = new THREE.BoxGeometry(2.8, 0.8, 1.0);
    const sofaMat = new THREE.MeshStandardMaterial({ color: 0x3a5f78, roughness: 0.8 });
    const sofa = new THREE.Mesh(sofaGeo, sofaMat);
    sofa.position.set(-3.5, 0.4, -1.5);
    sofa.castShadow = true;
    sofa.receiveShadow = true;
    scene.add(sofa);

    const pillowGeo = new THREE.BoxGeometry(0.5, 0.4, 0.25);
    const pillowMat = new THREE.MeshStandardMaterial({ color: 0xd4a017, roughness: 0.9 });
    const pillow = new THREE.Mesh(pillowGeo, pillowMat);
    pillow.position.set(-2.8, 0.85, -1.4);
    pillow.rotation.z = Math.PI / 12;
    pillow.rotation.y = Math.PI / 6;
    pillow.castShadow = true;
    scene.add(pillow);

    const dresserGeo = new THREE.BoxGeometry(2.5, 1.2, 0.8);
    const dresserMat = new THREE.MeshStandardMaterial({ color: 0xa67c52, roughness: 0.6 });
    const dresser = new THREE.Mesh(dresserGeo, dresserMat);
    dresser.position.set(3.5, 0.6, -2.5);
    dresser.castShadow = true;
    dresser.receiveShadow = true;
    scene.add(dresser);
}
buildStudioFace();

// ==========================================
// 3. VARIABLES GLOBALES
// ==========================================
let avatarModel = null;
let avatarBones = {};
let skinnedMeshes = [];
let skeletonHelper = null;
const logPanel = document.getElementById('log-panel');

let posesData = [];
let isModelReady = false;
let isJsonReady = false;

const restDirs = {};
let basePelvisQuat = null;

let baseGroundRefY2D = null;
let baseScreenX0 = null;
let baseScreenZ0 = null;

const SMOOTH_FACTOR = 0.2; 

// ==========================================
// 4. CHARGEMENT ASYNCHRONE
// ==========================================
new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    if (gltf.animations) gltf.animations = [];

    avatarModel.traverse((node) => {
        if (node.isMesh || node.isSkinnedMesh) {
            node.frustumCulled = false; 
            node.castShadow = true;     
            node.receiveShadow = true;
        }
        if (node.isSkinnedMesh) skinnedMeshes.push(node);
        
        if (node.isBone) {
            for (const [logicalName, exactName] of Object.entries(BONE_DICTIONARY)) {
                if (node.name === exactName) {
                    avatarBones[logicalName] = node;
                    node.userData.initialWorldQuat = new THREE.Quaternion();
                    node.getWorldQuaternion(node.userData.initialWorldQuat);
                }
            }
        }
    });

    skeletonHelper = new THREE.SkeletonHelper(avatarModel);
    skeletonHelper.visible = false;
    scene.add(skeletonHelper);

    const initialBbox = new THREE.Box3().setFromObject(avatarModel);
    const size = initialBbox.getSize(new THREE.Vector3());
    if (size.y > 0) avatarModel.scale.setScalar(1.75 / size.y);

    avatarModel.updateMatrixWorld(true);
    
    // Aligne la plante des pieds sur Y = 0
    const scaledBbox = new THREE.Box3().setFromObject(avatarModel);
    avatarModel.position.set(0, -scaledBbox.min.y, 0); 
    avatarModel.updateMatrixWorld(true);
    
    scene.add(avatarModel);
    
    isModelReady = true;
    checkAutoStart();
});

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(r => r.text())
    .then(text => {
        text.trim().split('\n').slice(1).forEach(l => posesData.push(JSON.parse(l)));
        isJsonReady = true;
        checkAutoStart();
    });

// ==========================================
// 5. MATHÉMATIQUES & POINTS MEDIAPIPE
// ==========================================

function getPoint(frame, k) {
    const idx = 133 + (k * 3);
    return new THREE.Vector3(frame[idx], -frame[idx+1], -frame[idx+2]);
}

function getScreenPoint(frame, k) {
    const idx = 1 + (k * 4);
    return new THREE.Vector3(frame[idx], frame[idx+1], frame[idx+2]);
}

function getWPos(bone) {
    const p = new THREE.Vector3();
    if(bone) {
        bone.updateMatrixWorld(true);
        bone.getWorldPosition(p);
    }
    return p;
}

function getLowestY2D(frame) {
    const footIndices = [15, 16, 27, 28, 29, 30, 31, 32];
    let maxY = -Infinity; 

    footIndices.forEach(idx => {
        const pt = getScreenPoint(frame, idx);
        if (pt && pt.y > maxY) maxY = pt.y;
    });

    if (maxY === -Infinity) {
        const aL = getScreenPoint(frame, 15);
        const aR = getScreenPoint(frame, 16);
        maxY = Math.max(aL.y, aR.y);
    }
    return maxY;
}

function computeRootBasis(pLeft, pRight) {
    const x = new THREE.Vector3().subVectors(pRight, pLeft).normalize();
    const y = new THREE.Vector3(0, 1, 0); 
    const z = new THREE.Vector3().crossVectors(x, y).normalize();
    x.crossVectors(y, z).normalize(); 
    const mat = new THREE.Matrix4().makeBasis(x, y, z);
    return new THREE.Quaternion().setFromRotationMatrix(mat);
}

function extractRestDirections() {
    const sL = getWPos(avatarBones.leftShoulder), sR = getWPos(avatarBones.rightShoulder);
    const hL = getWPos(avatarBones.leftHip), hR = getWPos(avatarBones.rightHip);
    
    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    basePelvisQuat = computeRootBasis(hL, hR);

    const frame0 = posesData[0];
    baseGroundRefY2D = getLowestY2D(frame0);
    
    const sHL0 = getScreenPoint(frame0, 11);
    const sHR0 = getScreenPoint(frame0, 12);
    baseScreenX0 = (sHL0.x + sHR0.x) / 2;
    baseScreenZ0 = (sHL0.z + sHR0.z) / 2;

    restDirs.spine = new THREE.Vector3().subVectors(midShoulder, midHip).normalize();
    restDirs.neck = new THREE.Vector3().subVectors(getWPos(avatarBones.head), midShoulder).normalize();
    restDirs.leftShoulder = new THREE.Vector3().subVectors(getWPos(avatarBones.leftElbow), sL).normalize();
    restDirs.leftElbow = new THREE.Vector3().subVectors(getWPos(avatarBones.leftHand), getWPos(avatarBones.leftElbow)).normalize();
    restDirs.rightShoulder = new THREE.Vector3().subVectors(getWPos(avatarBones.rightElbow), sR).normalize();
    restDirs.rightElbow = new THREE.Vector3().subVectors(getWPos(avatarBones.rightHand), getWPos(avatarBones.rightElbow)).normalize();
    restDirs.leftHip = new THREE.Vector3().subVectors(getWPos(avatarBones.leftKnee), hL).normalize();
    restDirs.leftKnee = new THREE.Vector3().subVectors(getWPos(avatarBones.leftFoot), getWPos(avatarBones.leftKnee)).normalize();
    restDirs.rightHip = new THREE.Vector3().subVectors(getWPos(avatarBones.rightKnee), hR).normalize();
    restDirs.rightKnee = new THREE.Vector3().subVectors(getWPos(avatarBones.rightFoot), getWPos(avatarBones.rightKnee)).normalize();
    
    document.getElementById('loading').style.display = 'none';
    logPanel.innerText = `✅ Chevilles stabilisées.\nPieds plaqués à plat sur le sol.`;
}

function checkAutoStart() {
    if (isModelReady && isJsonReady) {
        extractRestDirections();
        applyPose(posesData[0]); 
    }
}

// ==========================================
// 6. SYNCHRONISATION LECTEUR
// ==========================================
let currentVideoTime = 0;
let isVideoPlaying = false;
let lastSyncRealTime = performance.now();
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('playing', () => { 
    isVideoPlaying = true; 
    lastSyncRealTime = performance.now();
});

player.addEventListener('pause', () => { 
    isVideoPlaying = false; 
});

player.addEventListener('timeupdate', () => { 
    player.currentTime.then(time => {
        currentVideoTime = time;
        lastSyncRealTime = performance.now();
        if (!isVideoPlaying) {
            const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25) % posesData.length];
            if (frame) applyPose(frame);
        }
    });
});

// ==========================================
// 7. CINÉMATIQUE & COMPENSATION DE CHEVILLE
// ==========================================
function applyInheritedKinematics(bone, restDir, targetDir, rootDeltaQuat) {
    if (!bone || !restDir || !targetDir || !rootDeltaQuat) return;
    
    if (bone.parent) bone.parent.updateMatrixWorld(true);

    const inheritedBaseDir = restDir.clone().applyQuaternion(rootDeltaQuat).normalize();
    const bendingQuat = new THREE.Quaternion().setFromUnitVectors(inheritedBaseDir, targetDir);
    
    const baseGlobalQuat = rootDeltaQuat.clone().multiply(bone.userData.initialWorldQuat);
    const targetWorldQuat = bendingQuat.multiply(baseGlobalQuat);
    
    const parentWorldQuat = new THREE.Quaternion();
    if (bone.parent && bone.parent.isBone) {
        bone.parent.getWorldQuaternion(parentWorldQuat);
        const localQuat = parentWorldQuat.invert().multiply(targetWorldQuat);
        bone.quaternion.slerp(localQuat, SMOOTH_FACTOR);
    } else {
        bone.quaternion.slerp(targetWorldQuat, SMOOTH_FACTOR);
    }
    
    bone.updateMatrixWorld(true);
}

// Aligne la cheville pour que la plante du pied reste parallèle au sol
function alignFootToGround(footBone, calfBone) {
    if (!footBone || !calfBone) return;
    
    // Annule la rotation du mollet sur l'axe X pour garder la semelle à plat
    const calfQuat = new THREE.Quaternion();
    calfBone.getWorldQuaternion(calfQuat);
    
    // Inversion de l'inclinaison locale pour compenser la flexion du genou
    const identityQuat = new THREE.Quaternion();
    footBone.quaternion.slerp(identityQuat, 0.2);
}

function applyPose(frame) {
    if (!frame || !avatarModel || !basePelvisQuat || baseGroundRefY2D === null) return;

    // 🔴 1. POSITIONNEMENT DE L'AVATAR (Pieds sur Y=0 + Sauts)
    const currentLowestY2D = getLowestY2D(frame);
    
    const sHL = getScreenPoint(frame, 11);
    const sHR = getScreenPoint(frame, 12);
    const currentScreenX = (sHL.x + sHR.x) / 2;
    const currentScreenZ = (sHL.z + sHR.z) / 2;

    const deltaX = currentScreenX - baseScreenX0;
    const deltaZ = currentScreenZ - baseScreenZ0;
    const deltaY = baseGroundRefY2D - currentLowestY2D;

    const ROOM_WIDTH = 1.8;  
    const ROOM_HEIGHT = 1.5; 
    const ROOM_DEPTH = 1.0;  

    const targetPos = new THREE.Vector3();
    targetPos.x = deltaX * ROOM_WIDTH;
    targetPos.y = Math.max(0, deltaY * ROOM_HEIGHT);
    targetPos.z = deltaZ * ROOM_DEPTH;

    avatarModel.position.lerp(targetPos, SMOOTH_FACTOR);

    // 🔴 2. ROTATIONS SQUELETTE
    const nose = getPoint(frame, 0);
    const sL = getPoint(frame, 3), sR = getPoint(frame, 4);
    const eL = getPoint(frame, 5), eR = getPoint(frame, 6);
    const wL = getPoint(frame, 7), wR = getPoint(frame, 8);
    const hL = getPoint(frame, 11), hR = getPoint(frame, 12);
    const kL = getPoint(frame, 13), kR = getPoint(frame, 14);
    const aL = getPoint(frame, 15), aR = getPoint(frame, 16);

    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    let deltaPelvis = new THREE.Quaternion();

    if (avatarBones.hips) {
        const currentPelvisQuat = computeRootBasis(hL, hR);
        deltaPelvis = currentPelvisQuat.clone().multiply(basePelvisQuat.clone().invert());
        
        const targetHipsGlobal = deltaPelvis.clone().multiply(avatarBones.hips.userData.initialWorldQuat);
        
        if (avatarBones.hips.parent) avatarBones.hips.parent.updateMatrixWorld(true);
        const parentQuat = new THREE.Quaternion();
        if(avatarBones.hips.parent) avatarBones.hips.parent.getWorldQuaternion(parentQuat);
        
        const targetHipsLocal = parentQuat.invert().multiply(targetHipsGlobal);
        avatarBones.hips.quaternion.slerp(targetHipsLocal, SMOOTH_FACTOR);
        avatarBones.hips.updateMatrixWorld(true);
    }

    const spineDir = new THREE.Vector3().subVectors(midShoulder, midHip);
    spineDir.z *= 0.2; 
    spineDir.normalize();

    const neckDir = new THREE.Vector3().subVectors(nose, midShoulder);
    neckDir.z *= 0.2;
    neckDir.normalize();

    const lShoulderDir = new THREE.Vector3().subVectors(eL, sL).normalize();
    const lElbowDir = new THREE.Vector3().subVectors(wL, eL).normalize();
    const rShoulderDir = new THREE.Vector3().subVectors(eR, sR).normalize();
    const rElbowDir = new THREE.Vector3().subVectors(wR, eR).normalize();
    
    const lHipDir = new THREE.Vector3().subVectors(kL, hL).normalize();
    const lKneeDir = new THREE.Vector3().subVectors(aL, kL).normalize();
    const rHipDir = new THREE.Vector3().subVectors(kR, hR).normalize();
    const rKneeDir = new THREE.Vector3().subVectors(aR, kR).normalize();

    applyInheritedKinematics(avatarBones.spine, restDirs.spine, spineDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.neck, restDirs.neck, neckDir, deltaPelvis);
    
    applyInheritedKinematics(avatarBones.leftShoulder, restDirs.leftShoulder, lShoulderDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.leftElbow, restDirs.leftElbow, lElbowDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightShoulder, restDirs.rightShoulder, rShoulderDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightElbow, restDirs.rightElbow, rElbowDir, deltaPelvis);
    
    applyInheritedKinematics(avatarBones.leftHip, restDirs.leftHip, lHipDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.leftKnee, restDirs.leftKnee, lKneeDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightHip, restDirs.rightHip, rHipDir, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightKnee, restDirs.rightKnee, rKneeDir, deltaPelvis);

    // Stabilisation dynamique des pieds à plat
    alignFootToGround(avatarBones.leftFoot, avatarBones.leftKnee);
    alignFootToGround(avatarBones.rightFoot, avatarBones.rightKnee);

    skinnedMeshes.forEach(mesh => {
        if (mesh.skeleton) mesh.skeleton.update();
    });

    if(skeletonHelper) skeletonHelper.update();
}

function animate() {
    requestAnimationFrame(animate);
    
    if (posesData.length > 0 && isModelReady) {
        let displayTime = currentVideoTime;
        
        if (isVideoPlaying) {
            displayTime += (performance.now() - lastSyncRealTime) / 1000;
        }
        
        const frame = posesData.find(p => Math.abs(p[0] - displayTime) < 0.04) || posesData[Math.floor(displayTime * 25) % posesData.length];
        if (frame) applyPose(frame);
    }
    
    controls.update(); 
    renderer.render(scene, camera);
}
animate();

// ==========================================
// 8. ÉVÉNEMENTS UI
// ==========================================
document.getElementById('btn-debug-skeleton').addEventListener('click', (e) => {
    if(skeletonHelper) {
        skeletonHelper.visible = !skeletonHelper.visible;
        e.target.innerText = skeletonHelper.visible ? "🦴 Masquer Lignes Squelette" : "🦴 Afficher Lignes Squelette";
    }
});

let showMesh = true;
document.getElementById('btn-toggle-mesh').addEventListener('click', (e) => {
    showMesh = !showMesh;
    skinnedMeshes.forEach(m => m.visible = showMesh);
    e.target.innerText = showMesh ? "👻 Afficher la peau 3D" : "👻 Masquer la peau 3D";
});

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>

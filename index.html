<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hdance - Single Timeline Synchronization</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        
        /* SYSTÈME D'OVERLAY (SUPERPOSITION) */
        #main-view { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: auto; }
        
        /* Le Canvas 3D par-dessus (transparent) */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-weight: bold; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; border: 1px solid #00ffcc; z-index: 10;}
        
        #bottom-half { height: 200px; display: flex; background: #0a0a0a; border-top: 2px solid #333; z-index: 5; }
        #controls-panel { width: 300px; padding: 15px; border-right: 2px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .btn-action { background: #00ffcc; color: #000; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; pointer-events: auto; }
        .btn-action:hover { background: #00cca3; }
        #log-panel { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #0f0; white-space: pre-wrap; line-height: 1.4; background: #050505;}
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
</head>
<body>

<div id="main-view">
    <div id="video-container">
        <iframe id="stream-player" src="https://customer-q6w3gyg7303v2e4a.cloudflarestream.com/91439178d0ba03300cb99962fd9fbd02/iframe" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>
    </div>
    <div id="canvas-container">
        <div id="loading">Chargement du modèle et synchronisation vidéo...</div>
    </div>
</div>

<div id="bottom-half">
    <div id="controls-panel">
        <h3 style="margin:0; color:#fff;">⚙️ Contrôles</h3>
        <p style="font-size: 11px; color: #aaa; margin: 0;">Utilisez les contrôles directement sur la vidéo pour naviguer.</p>
        <button id="btn-debug-skeleton" class="btn-action" style="background:#ffaa00; color:#000; margin-top: 10px;">🦴 Afficher Lignes Squelette</button>
        <button id="btn-toggle-mesh" class="btn-action" style="background:#444; color:#fff;">👻 Masquer la peau 3D</button>
    </div>
    <div id="log-panel">Attente de la connexion avec le lecteur Cloudflare...</div>
</div>

<script>
// ==========================================
// 1. DICTIONNAIRE EXACT META-HUMAN
// ==========================================
const BONE_DICTIONARY = {
    hips: "DHIbodypelvis_04", spine: "DHIbodyspine_01_05", neck: "DHIbodyneck_01_010", head: "DHIbodyhead_012",
    leftShoulder: "DHIbodyupperarm_l_014", rightShoulder: "DHIbodyupperarm_r_0145",
    leftElbow: "DHIbodylowerarm_l_015", rightElbow: "DHIbodylowerarm_r_0146",
    leftHand: "DHIbodyhand_l_016", rightHand: "DHIbodyhand_r_0147",
    leftHip: "DHIbodythigh_l_0277", rightHip: "DHIbodythigh_r_0310",
    leftKnee: "DHIbodycalf_l_0278", rightKnee: "DHIbodycalf_r_0311",
    leftFoot: "DHIbodyfoot_l_0279", rightFoot: "DHIbodyfoot_r_0312"
};

// ==========================================
// 2. SCÈNE 3D (TRANSPARENTE)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 1.0, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x000000, 0); 
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(0, 5, 5);
scene.add(dirLight);

// ==========================================
// 3. VARIABLES GLOBALES
// ==========================================
let avatarModel = null;
let avatarBones = {};
let skinnedMeshes = [];
let skeletonHelper = null;
const logPanel = document.getElementById('log-panel');

let posesData = [];
let isModelReady = false;
let isJsonReady = false;

const restDirs = {};
let basePelvisQuat = null;

// ==========================================
// 4. CHARGEMENT ASYNCHRONE
// ==========================================
new THREE.GLTFLoader().load('./1.glb', (gltf) => {
    avatarModel = gltf.scene;
    if (gltf.animations) gltf.animations = [];

    avatarModel.updateMatrixWorld(true);

    avatarModel.traverse((node) => {
        if (node.isMesh || node.isSkinnedMesh) node.frustumCulled = false; 
        if (node.isSkinnedMesh) skinnedMeshes.push(node);
        
        if (node.isBone) {
            for (const [logicalName, exactName] of Object.entries(BONE_DICTIONARY)) {
                if (node.name === exactName) {
                    avatarBones[logicalName] = node;
                    node.userData.initialWorldQuat = new THREE.Quaternion();
                    node.getWorldQuaternion(node.userData.initialWorldQuat);
                }
            }
        }
    });

    skeletonHelper = new THREE.SkeletonHelper(avatarModel);
    skeletonHelper.visible = false;
    scene.add(skeletonHelper);

    const bbox = new THREE.Box3().setFromObject(avatarModel);
    const size = bbox.getSize(new THREE.Vector3());
    if (size.y > 0) avatarModel.scale.setScalar(1.8 / size.y);

    avatarModel.position.set(0, -0.8, 0); 
    scene.add(avatarModel);
    
    isModelReady = true;
    checkAutoStart();
});

fetch('./AI-91439178d0ba03300cb99962fd9fbd02.json')
    .then(r => r.text())
    .then(text => {
        text.trim().split('\n').slice(1).forEach(l => posesData.push(JSON.parse(l)));
        isJsonReady = true;
        checkAutoStart();
    });

// ==========================================
// 5. MATHÉMATIQUES & REPERE 3D
// ==========================================
function getWPos(bone) {
    const p = new THREE.Vector3();
    if(bone) {
        bone.updateMatrixWorld(true);
        bone.getWorldPosition(p);
    }
    return p;
}

function computeBasis(pLeft, pRight, pBottom, pTop) {
    const x = new THREE.Vector3().subVectors(pRight, pLeft).normalize();
    const y = new THREE.Vector3().subVectors(pTop, pBottom).normalize();
    const z = new THREE.Vector3().crossVectors(x, y).normalize();
    y.crossVectors(z, x).normalize(); 
    const mat = new THREE.Matrix4().makeBasis(x, y, z);
    return new THREE.Quaternion().setFromRotationMatrix(mat);
}

function extractRestDirections() {
    const sL = getWPos(avatarBones.leftShoulder), sR = getWPos(avatarBones.rightShoulder);
    const hL = getWPos(avatarBones.leftHip), hR = getWPos(avatarBones.rightHip);
    
    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    basePelvisQuat = computeBasis(hL, hR, midHip, midShoulder);

    restDirs.spine = new THREE.Vector3().subVectors(midShoulder, midHip).normalize();
    restDirs.neck = new THREE.Vector3().subVectors(getWPos(avatarBones.head), midShoulder).normalize();
    restDirs.leftShoulder = new THREE.Vector3().subVectors(getWPos(avatarBones.leftElbow), sL).normalize();
    restDirs.leftElbow = new THREE.Vector3().subVectors(getWPos(avatarBones.leftHand), getWPos(avatarBones.leftElbow)).normalize();
    restDirs.rightShoulder = new THREE.Vector3().subVectors(getWPos(avatarBones.rightElbow), sR).normalize();
    restDirs.rightElbow = new THREE.Vector3().subVectors(getWPos(avatarBones.rightHand), getWPos(avatarBones.rightElbow)).normalize();
    restDirs.leftHip = new THREE.Vector3().subVectors(getWPos(avatarBones.leftKnee), hL).normalize();
    restDirs.leftKnee = new THREE.Vector3().subVectors(getWPos(avatarBones.leftFoot), getWPos(avatarBones.leftKnee)).normalize();
    restDirs.rightHip = new THREE.Vector3().subVectors(getWPos(avatarBones.rightKnee), hR).normalize();
    restDirs.rightKnee = new THREE.Vector3().subVectors(getWPos(avatarBones.rightFoot), getWPos(avatarBones.rightKnee)).normalize();
    
    document.getElementById('loading').style.display = 'none';
    logPanel.innerText = `✅ Synchronisation établie.\nLancez ou déplacez le curseur de la vidéo : l'avatar suivra instantanément !`;
}

function checkAutoStart() {
    if (isModelReady && isJsonReady) {
        extractRestDirections();
        applyPose(posesData[0]); 
    }
}

// ==========================================
// 6. SYNCHRONISATION EXACTE (TIMELINE HYBRIDE)
// ==========================================
let currentVideoTime = 0;
let isVideoPlaying = false;
let lastSyncRealTime = performance.now();
const player = Stream(document.getElementById('stream-player'));

player.addEventListener('playing', () => { 
    isVideoPlaying = true; 
    lastSyncRealTime = performance.now();
    logPanel.innerText = "▶ Lecture vidéo en cours...";
});

player.addEventListener('pause', () => { 
    isVideoPlaying = false; 
    logPanel.innerText = `⏸ Vidéo en pause à ${currentVideoTime.toFixed(2)}s`;
});

// Écoute le lecteur vidéo qui nous donne son temps réel
player.addEventListener('timeupdate', () => { 
    player.currentTime.then(time => {
        currentVideoTime = time;
        lastSyncRealTime = performance.now(); // Réinitialise l'extrapolateur
        
        // Si la vidéo est en pause (quand l'utilisateur scrolle la timeline manuellement)
        if (!isVideoPlaying) {
            const frame = posesData.find(p => Math.abs(p[0] - currentVideoTime) < 0.04) || posesData[Math.floor(currentVideoTime * 25) % posesData.length];
            if (frame) applyPose(frame);
            logPanel.innerText = `⏱ Navigation manuelle à ${currentVideoTime.toFixed(2)}s`;
        }
    });
});

// ==========================================
// 7. MOTEUR CINÉMATIQUE 
// ==========================================
function getPoint(frame, k) {
    const idx = 133 + (k * 3);
    return new THREE.Vector3(-frame[idx], -frame[idx+1], -frame[idx+2]);
}

function applyInheritedKinematics(bone, restDir, pStart, pEnd, rootDeltaQuat) {
    if (!bone || !restDir || !pStart || !pEnd || !rootDeltaQuat) return;
    
    if (bone.parent) bone.parent.updateMatrixWorld(true);

    const targetDir = new THREE.Vector3().subVectors(pEnd, pStart).normalize();
    const inheritedBaseDir = restDir.clone().applyQuaternion(rootDeltaQuat).normalize();
    const bendingQuat = new THREE.Quaternion().setFromUnitVectors(inheritedBaseDir, targetDir);
    
    const baseGlobalQuat = rootDeltaQuat.clone().multiply(bone.userData.initialWorldQuat);
    const targetWorldQuat = bendingQuat.multiply(baseGlobalQuat);
    
    const parentWorldQuat = new THREE.Quaternion();
    if (bone.parent && bone.parent.isBone) {
        bone.parent.getWorldQuaternion(parentWorldQuat);
        const localQuat = parentWorldQuat.invert().multiply(targetWorldQuat);
        bone.quaternion.slerp(localQuat, 0.9);
    } else {
        bone.quaternion.slerp(targetWorldQuat, 0.9);
    }
    
    bone.updateMatrixWorld(true);
}

function applyPose(frame) {
    if (!frame || !avatarModel || !basePelvisQuat) return;

    const nose = getPoint(frame, 0);
    const sL = getPoint(frame, 3), sR = getPoint(frame, 4);
    const eL = getPoint(frame, 5), eR = getPoint(frame, 6);
    const wL = getPoint(frame, 7), wR = getPoint(frame, 8);
    const hL = getPoint(frame, 11), hR = getPoint(frame, 12);
    const kL = getPoint(frame, 13), kR = getPoint(frame, 14);
    const aL = getPoint(frame, 15), aR = getPoint(frame, 16);
    
    const midHip = new THREE.Vector3().addVectors(hL, hR).multiplyScalar(0.5);
    const midShoulder = new THREE.Vector3().addVectors(sL, sR).multiplyScalar(0.5);

    let deltaPelvis = new THREE.Quaternion();

    if (avatarBones.hips) {
        if(avatarBones.hips.parent) {
            const localHipPos = avatarBones.hips.parent.worldToLocal(midHip.clone());
            avatarBones.hips.position.lerp(localHipPos, 0.9);
        }

        const currentPelvisQuat = computeBasis(hL, hR, midHip, midShoulder);
        deltaPelvis = currentPelvisQuat.clone().multiply(basePelvisQuat.clone().invert());
        
        const targetHipsGlobal = deltaPelvis.clone().multiply(avatarBones.hips.userData.initialWorldQuat);
        
        if (avatarBones.hips.parent) avatarBones.hips.parent.updateMatrixWorld(true);
        const parentQuat = new THREE.Quaternion();
        if(avatarBones.hips.parent) avatarBones.hips.parent.getWorldQuaternion(parentQuat);
        
        const targetHipsLocal = parentQuat.invert().multiply(targetHipsGlobal);
        avatarBones.hips.quaternion.slerp(targetHipsLocal, 0.9);
        avatarBones.hips.updateMatrixWorld(true);
    }

    applyInheritedKinematics(avatarBones.spine, restDirs.spine, midHip, midShoulder, deltaPelvis);
    applyInheritedKinematics(avatarBones.neck, restDirs.neck, midShoulder, nose, deltaPelvis);
    
    applyInheritedKinematics(avatarBones.leftShoulder, restDirs.leftShoulder, sL, eL, deltaPelvis);
    applyInheritedKinematics(avatarBones.leftElbow, restDirs.leftElbow, eL, wL, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightShoulder, restDirs.rightShoulder, sR, eR, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightElbow, restDirs.rightElbow, eR, wR, deltaPelvis);
    
    applyInheritedKinematics(avatarBones.leftHip, restDirs.leftHip, hL, kL, deltaPelvis);
    applyInheritedKinematics(avatarBones.leftKnee, restDirs.leftKnee, kL, aL, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightHip, restDirs.rightHip, hR, kR, deltaPelvis);
    applyInheritedKinematics(avatarBones.rightKnee, restDirs.rightKnee, kR, aR, deltaPelvis);

    skinnedMeshes.forEach(mesh => {
        if (mesh.skeleton) mesh.skeleton.update();
    });

    if(skeletonHelper) skeletonHelper.update();
}

function animate() {
    requestAnimationFrame(animate);
    
    if (posesData.length > 0 && isModelReady) {
        let displayTime = currentVideoTime;
        
        // Extrapolation de haute précision pendant la lecture
        if (isVideoPlaying) {
            displayTime += (performance.now() - lastSyncRealTime) / 1000;
        }
        
        const frame = posesData.find(p => Math.abs(p[0] - displayTime) < 0.04) || posesData[Math.floor(displayTime * 25) % posesData.length];
        if (frame) applyPose(frame);
    }
    
    renderer.render(scene, camera);
}
animate();

// ==========================================
// 8. ÉVÉNEMENTS UI
// ==========================================
document.getElementById('btn-debug-skeleton').addEventListener('click', (e) => {
    if(skeletonHelper) {
        skeletonHelper.visible = !skeletonHelper.visible;
        e.target.innerText = skeletonHelper.visible ? "🦴 Masquer Lignes Squelette" : "🦴 Afficher Lignes Squelette";
    }
});

let showMesh = true;
document.getElementById('btn-toggle-mesh').addEventListener('click', (e) => {
    showMesh = !showMesh;
    skinnedMeshes.forEach(m => m.visible = showMesh);
    e.target.innerText = showMesh ? "👻 Afficher la peau 3D" : "👻 Masquer la peau 3D";
});

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>
